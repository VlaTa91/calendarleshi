function addEvent(){const k=key(selectedDate,selectedType);if(events.some(e=>e.key===k)){status('Такая запись на эту дату уже существует.');return}events.push({key:k,date:selectedDate,type:selectedType,synced:false,googleId:null});persist();render();status('Сохранено локально. Нажмите «Синхронизировать» для отправки в Google.')}
async function removeEvent(k){const e=events.find(x=>x.key===k);if(!e)return;if(!confirm('Удалить запись «'+type(e.type).name+'»?'))return;deleteLocal(e);render();status('Запись удалена локально. Нажми «Синхронизировать ↕», чтобы удалить её и в Google.')}
function googleBody(e){const t=type(e.type),summary=e.type==='kolpino'?'Колпино':e.type==='off'?'Выходной':'Лёша — '+(e.type.startsWith('day')?'дневная':'ночная')+' смена ('+t.hours+' часов)';const base={summary,description:`Создано приложением «Календарь Лёши». Тип: ${e.type}. Рабочие часы: ${t.hours}.`,extendedProperties:{private:{leshaKey:e.key,leshaType:e.type}}};if(e.type==='off'||(e.type==='kolpino'&&config.kolpinoAllDay))return {...base,start:{date:e.date},end:{date:addDays(e.date,1)}};const startTime=e.type==='kolpino'?config.kolpinoTime:(e.type.startsWith('day')?config.startDay:config.startNight);const duration=e.type==='kolpino'?1:t.hours;const [h,m]=startTime.split(':').map(Number);const start=new Date(`${e.date}T00:00:00+03:00`);start.setTime(start.getTime()+(h*60+m)*60000);const end=new Date(start.getTime()+duration*3600000);const fmt=d=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Moscow',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(d).replace(' ','T')+'+03:00';return {...base,start:{dateTime:fmt(start),timeZone:'Europe/Moscow'},end:{dateTime:fmt(end),timeZone:'Europe/Moscow'}}}
async function api(method,path,body){if(!token)throw Error('Сначала войдите в Google.');const res=await fetch('https://www.googleapis.com/calendar/v3'+path,{method,headers:{Authorization:'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});if(res.status===204)return {};const data=await res.json().catch(()=>({}));if(!res.ok){const details=(data.error?.errors||[]).map(x=>x.reason||x.message).join(', ');let message=data.error?.message||'HTTP '+res.status;throw Error(method+' '+res.status+': '+message+(details&&details!==message?' ('+details+')':'')+'. Проверь ID календаря и права доступа.')}return data}
async function sync(){if(syncing)return;if(!token){status('Сначала нажмите «Войти в Google».');return}if(!config.calendar){status('Заполни ID календаря в настройках.');return}syncing=true;let sent=0,removed=0,received=0;status('Синхронизация в обе стороны…');try{
for(const d of [...pendingDeletes]){try{await api('DELETE',`/calendars/${encodeURIComponent(config.calendar)}/events/${encodeURIComponent(d.id)}`)}catch(err){if(!/404|410|not found/i.test(err.message))throw err}pendingDeletes=pendingDeletes.filter(x=>x.id!==d.id);store('lesha-deletes-v1',pendingDeletes);removed++}
for(const e of events.filter(x=>!x.synced)){let result;const body=googleBody(e);if(e.googleId){result=await api('PUT',`/calendars/${encodeURIComponent(config.calendar)}/events/${encodeURIComponent(e.googleId)}`,body)}else{result=await api('POST',`/calendars/${encodeURIComponent(config.calendar)}/events`,body)}e.googleId=result.id;e.synced=true;persist();sent++}
const months=new Set([...Array.from({length:viewCount},(_,i)=>Math.floor((view+i)/12)+'-'+String((view+i)%12+1).padStart(2,'0')),...events.map(e=>e.date.slice(0,7))]);for(const month of months){received+=await pullMonth(month)}status(`Готово ↕ Отправлено: ${sent}, удалено: ${removed}, получено: ${received}. Изменения из Google обновлены.`)
}catch(err){status('Ошибка синхронизации: '+err.message)}finally{syncing=false;render()}}
async function pullMonth(month){const [year,m]=month.split('-').map(Number);const from=new Date(Date.UTC(year,m-1,1)-86400000).toISOString(),to=new Date(Date.UTC(year,m,1)+86400000).toISOString();let page='',items=[];do{const path=`/calendars/${encodeURIComponent(config.calendar)}/events?singleEvents=true&maxResults=250&timeMin=${encodeURIComponent(from)}&timeMax=${encodeURIComponent(to)}`+(page?'&pageToken='+encodeURIComponent(page):'');const data=await api('GET',path);items.push(...(data.items||[]));page=data.nextPageToken||''}while(page);let added=0;const seen=new Set();for(const item of items){const k=item.extendedProperties?.private?.leshaKey,t=item.extendedProperties?.private?.leshaType;if(!k||!TYPES.some(x=>x.id===t)||!k.startsWith(month+'-')||pendingDeletes.some(x=>x.id===item.id))continue;seen.add(k);const existing=events.find(e=>e.key===k);if(existing){if(existing.synced){existing.googleId=item.id;existing.type=t}}else{events.push({key:k,date:k.split('|')[0],type:t,googleId:item.id,synced:true});added++}}events=events.filter(e=>!(e.date.startsWith(month+'-')&&e.synced&&!seen.has(e.key)));persist();return added}
async function pull(){if(!token){status('Сначала войдите в Google.');return}try{let n=0;for(let i=0;i<viewCount;i++){const m=Math.floor((view+i)/12)+'-'+String((view+i)%12+1).padStart(2,'0');n+=await pullMonth(m)}render();status('Из Google загружено новых записей: '+n)}catch(err){status('Ошибка получения из Google: '+err.message)}}

function login(){readConfig();if(!config.client){$('settings').open=true;status('Введите OAuth Client ID в настройках.');return}if(!window.google?.accounts?.oauth2){status('Сервис входа Google не загрузился. Проверьте интернет и HTTPS.');return}const client=google.accounts.oauth2.initTokenClient({client_id:config.client,scope:'https://www.googleapis.com/auth/calendar.events',callback:response=>{if(response.error){status('Ошибка Google: '+response.error);return}token=response.access_token;status('Google подключён. Нажми «Синхронизировать ↕» для проверки.');$('connect').textContent='Google ✓'}});client.requestAccessToken({prompt:token?'':'consent'})}
document.querySelectorAll('[data-months]').forEach(b=>b.onclick=()=>{viewCount=Number(b.dataset.months);store('lesha-view-count',viewCount);render()});$('quickMode').onclick=()=>{quickMode=!quickMode;render()};$('quickSync').onclick=sync;$('clearDay').onclick=()=>clearPeriod('day');$('clearMonth').onclick=()=>clearPeriod('month');$('prev').onclick=()=>{view--;render()};$('next').onclick=()=>{view++;render()};$('settingsSave').onclick=readConfig;$('openSettings').onclick=()=>{$('settings').open=!$('settings').open;if($('settings').open)$('settings').scrollIntoView({behavior:'smooth',block:'start'})};$('connect').onclick=login;$('logout').onclick=()=>{if(!confirm('Выйти из Google? Локальные смены сохранятся, но синхронизация будет недоступна до нового входа.'))return;if(token&&window.google?.accounts?.oauth2)google.accounts.oauth2.revoke(token,()=>{});token='';$('connect').textContent='Войти в Google';status('Выход из Google выполнен.')};fillConfig();render();if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.filter(r=>r.scope.startsWith(location.origin+location.pathname.replace(/[^/]*$/,''))).map(r=>r.unregister()))).catch(()=>{});if('caches' in window)caches.keys().then(keys=>Promise.all(keys.filter(k=>k.startsWith('calendar-leshi-')).map(k=>caches.delete(k)))).catch(()=>{})}
})();
</script></body></html>
